# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Source Options
# Use Modern Java(9+) Syntax (Courtesy of Jabel)
use_modern_java_syntax = false

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = false
show_testing_output = false

# Mod Information
mod_version = 1.0.0
root_package = com.cleanroommc.frameflow
mod_id = frameflow
mod_name = FrameFlow

# Mod Metadata (Optional)
mod_description = Client-side frame pacing, thread yield elimination, and chunk upload time-slicing for consistent frametimes.
mod_url =
mod_update_json =
# Delimit authors with commas
mod_authors = Brilliafy
mod_credits = CleanroomMC
mod_logo_path = logo.png

# Mapping Properties
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = false

# Run Configurations
# If multiple arguments/tweak classes are stated, use spaces as the delimiter
minecraft_username = Developer
extra_jvm_args =
extra_tweak_classes =

# Maven Publishing (Provide secret: MAVEN_USER, MAVEN_PASS)
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# Publishing
release_type = release
publish_with_changelog = false
publish_to_curseforge = false
publish_to_modrinth = false

# Modify Minecraft Sources
change_minecraft_sources = false

# Tags
use_tags = true
tag_class_name = ${root_package}.Tags

# Access Transformers
use_access_transformer = false
access_transformer_locations =

# Mixins
use_mixins = true
mixin_booter_version = 10.2
generate_mixins_json = false
mixin_configs = ${mod_id}
mixin_refmap = mixins.${mod_id}.refmap.json
mixin_package = ${root_package}.mixin

# Coremods
is_coremod = true
coremod_includes_mod = true
coremod_plugin_class_name = com.cleanroommc.frameflow.core.FrameFlowCorePlugin

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5
